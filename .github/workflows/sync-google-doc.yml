name: Update book text from Google Doc

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the public Google Doc
        run: curl --fail --location --retry 3 --output "$RUNNER_TEMP/book.docx" 'https://docs.google.com/document/d/1rfjYaZ-OtbNZ0tjB7AoF4Av-HtXZpN1fpoJ8P3YnYfU/export?format=docx'
      - name: Prepare illustration conversion
        run: |
          python3 -m venv "$RUNNER_TEMP/book-env"
          "$RUNNER_TEMP/book-env/bin/pip" install --quiet Pillow
      - name: Extract text and illustrations
        run: "$RUNNER_TEMP/book-env/bin/python" sync_google_doc.py "$RUNNER_TEMP/book.docx" content.json book-images
      - name: Publish changed book content
        run: |
          git add -A -- content.json book-images
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update book from Google Doc'
          git push
